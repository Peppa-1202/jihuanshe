name: Sync Jihuanshe to Google Sheets
on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'repair=仅纠正在线表格；all=模拟器完整采集；phase1/2/3=单阶段'
        type: choice
        options: [repair, all, phase1, phase2, phase3]
        default: repair
      apply:
        description: '将结果写入 Google 表格（关闭则仅预览）'
        type: boolean
        default: true
      refresh:
        description: '重新读取已完成产品，检查新数据（关闭则断点续跑）'
        type: boolean
        default: true
concurrency:
  group: jihuanshe-google-sheets
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  sync:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ inputs.phase == 'repair' && 'ubuntu-latest' || fromJSON('["self-hosted","Windows","X64","jihuanshe"]') }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies and test
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -v
          exit $LASTEXITCODE
      - name: Collect, repair and sync
        shell: pwsh
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ vars.SPREADSHEET_ID }}
          ADB_PATH: ${{ vars.ADB_PATH }}
          ADB_SERIAL: ${{ vars.ADB_SERIAL }}
          PHASE: ${{ inputs.phase }}
          APPLY: ${{ inputs.apply }}
          REFRESH: ${{ inputs.refresh }}
          PYTHONUTF8: '1'
        run: |
          $opts = @('--phase', $env:PHASE, '--output', 'output')
          if ($env:APPLY -eq 'true') { $opts += '--apply' }
          if ($env:REFRESH -eq 'true') { $opts += '--refresh' }
          python -u run_sync.py @opts
          exit $LASTEXITCODE
      - name: Save run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-report
          path: |
            output/report.json
            output/summary.md
          if-no-files-found: warn
          retention-days: 90
      - name: Save CSV checkpoints for recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoints
          path: output/checkpoints-*/
          if-no-files-found: warn
          retention-days: 14
  dashboard:
    needs: sync
    if: always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: run-report
          path: downloaded
      - name: Update persistent dashboard
        env:
          SYNC_RESULT: ${{ needs.sync.result }}
          PHASE: ${{ inputs.phase }}
        run: python publish_dashboard.py --report downloaded/report.json
      - name: Commit dashboard
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update Jihuanshe run dashboard'
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
